name: 打包 Windows exe

# 什么时候运行：
#   · 推送到 main：打包；如果 VERSION 里的版本还没发布过，自动发布到 Releases（标签 v+版本号）
#   · 推送 v* 标签：打包并发布该标签
#   · 在 Actions 页面手动运行：同「推送到 main」
# 只改 README 等说明文件时不运行。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".gitignore", ".gitattributes"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 确定版本
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v" + (Get-Content VERSION -Raw).Trim()
          }
          gh release view $tag --repo ${{ github.repository }} *> $null
          $publish = ($LASTEXITCODE -ne 0)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "版本 $tag，需要发布：$publish"

      - name: 安装依赖
        run: python -m pip install -U pip -r requirements.txt

      - name: 打包
        run: python build.py --no-install

      - name: 压缩
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath yingzi-downloader-windows.zip
          Get-ChildItem dist, yingzi-downloader-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: yingzi-downloader-windows
          path: yingzi-downloader-windows.zip

      - name: 发布到 Releases
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          files: yingzi-downloader-windows.zip
          generate_release_notes: true
