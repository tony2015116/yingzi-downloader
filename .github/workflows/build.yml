name: 打包 Windows exe

# 推送 v* 标签（如 v1.0.0）时打包并发布到 Releases；也可以在 Actions 页面手动运行（只打包，不发布）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -U pip -r requirements.txt

      - name: 打包
        run: python build.py --no-install

      - name: 压缩
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath yingzi-downloader-windows.zip
          Get-ChildItem dist, yingzi-downloader-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: yingzi-downloader-windows
          path: yingzi-downloader-windows.zip

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: yingzi-downloader-windows.zip
          generate_release_notes: true
